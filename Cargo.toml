[package]
name = "cloudnest"
version = "2.0.0"
edition = "2024"
description = "A small, reliable personal cloud drive"
license = "MIT"
rust-version = "1.94"

[dependencies]
argon2 = "0.6"
askama = "0.16"
axum = { version = "0.8", features = ["multipart", "http1"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
mime_guess = "2"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros"] }
tar = "0.4"
tempfile = "3.27"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1.2"
tower-http = { version = "0.7", features = ["trace", "limit", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3.5", features = ["json"] }
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
