name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 构建 ${{ matrix.arch }} 发布包
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            target: aarch64-unknown-linux-musl
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 校验 tag 与 Cargo.toml 版本一致
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -q "^version = \"$tag\"" Cargo.toml; then
            echo "::error::tag $GITHUB_REF_NAME 与 Cargo.toml 中的版本不一致"
            grep -n "^version" Cargo.toml
            exit 1
          fi
          echo "版本一致：$tag"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 构建 musl 静态二进制
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --locked
          strip: true

      - name: 检查静态链接
        run: |
          set -euo pipefail
          src_dir="target/${{ matrix.target }}/release"
          binary="$src_dir/cloudnest"
          if [ ! -f "$binary" ]; then
            binary="$src_dir/cloudnest"
          fi
          if [ ! -f "$binary" ]; then
            echo "::error::未找到构建产物，请检查 Cargo 包名"
            ls -l "$src_dir"
            exit 1
          fi
          file "$binary"
          # musl 目标可能产出 static-pie 或 static，两者都算静态链接
          if ! file "$binary" | grep -Eq "statically linked|static-pie linked"; then
            echo "::error::$binary 不是静态链接，musl 构建失败"
            exit 1
          fi

      - name: 组装发布包
        run: |
          set -euo pipefail
          pkg="cloudnest-linux-${{ matrix.arch }}"
          src_dir="target/${{ matrix.target }}/release"
          binary="$src_dir/cloudnest"
          if [ ! -f "$binary" ]; then
            binary="$src_dir/cloudnest"
          fi
          if [ ! -f "$binary" ]; then
            echo "::error::未找到构建产物，请检查 Cargo 包名"
            exit 1
          fi
          mkdir -p "dist/$pkg"
          cp "$binary" "dist/$pkg/cloudnest"
          # Windows 工作区可能把 CRLF 带入脚本；发布前强制归一化并校验，
          # 否则直接执行会报 pipefail 无效或 $'\r': command not found。
          sed -i 's/\r$//' scripts/install.sh
          if grep -q $'\r' scripts/install.sh; then
            echo "::error::scripts/install.sh 含 CRLF 行尾"
            exit 1
          fi
          cp scripts/install.sh packaging/cloudnest.service packaging/config.toml.example README.md LICENSE THIRD_PARTY_NOTICES.md "dist/$pkg/"
          cp -r docs "dist/$pkg/"
          chmod 0755 "dist/$pkg/cloudnest" "dist/$pkg/install.sh"
          tar -czf "dist/$pkg.tar.gz" -C "dist/$pkg" .
          (cd dist && sha256sum "$pkg.tar.gz" > "$pkg.tar.gz.sha256")
          ls -l "dist/$pkg.tar.gz" "dist/$pkg.tar.gz.sha256"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: cloudnest-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 校验产物完整性
        run: |
          set -euo pipefail
          test -f dist/cloudnest-linux-x86_64.tar.gz
          test -f dist/cloudnest-linux-aarch64.tar.gz
          test -f dist/cloudnest-linux-x86_64.tar.gz.sha256
          test -f dist/cloudnest-linux-aarch64.tar.gz.sha256

      - name: 生成 SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum cloudnest-linux-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: 准备独立安装脚本
        run: |
          set -euo pipefail
          sed -i 's/\r$//' scripts/install.sh
          if grep -q $'\r' scripts/install.sh; then
            echo "::error::scripts/install.sh 含 CRLF 行尾"
            exit 1
          fi
          bash -n scripts/install.sh
          cp scripts/install.sh dist/install.sh
          chmod 0755 dist/install.sh

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/cloudnest-linux-x86_64.tar.gz
            dist/cloudnest-linux-aarch64.tar.gz
            dist/cloudnest-linux-x86_64.tar.gz.sha256
            dist/cloudnest-linux-aarch64.tar.gz.sha256
            dist/SHA256SUMS
            dist/install.sh

      - name: 校验已发布的 install.sh 资产
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" -o /tmp/released-install.sh; then
              break
            fi
            echo "资产尚未可下载，稍后重试（$attempt/5）"
            sleep 5
          done
          test -s /tmp/released-install.sh
          if grep -q $'\r' /tmp/released-install.sh; then
            echo "::error::已发布的 install.sh 含 CRLF 行尾"
            exit 1
          fi
          bash -n /tmp/released-install.sh
          sha256sum /tmp/released-install.sh
