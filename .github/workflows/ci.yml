name: CI

# 每次 push 到 main/master 时执行：代码格式、Clippy、测试与安装脚本检查

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: 格式、静态检查与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2

      - name: 代码格式检查
        run: cargo fmt --all -- --check

      - name: Clippy（警告视为错误）
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: 运行测试
        run: cargo test --all-targets --locked

      - name: 安装脚本检查
        run: |
          set -euo pipefail
          if grep -q $'\r' scripts/install.sh; then
            echo "::error::scripts/install.sh 含 CRLF 行尾；请保持 LF，否则 bash 执行会报 pipefail/\$'\\r' 错误"
            exit 1
          fi
          bash -n scripts/install.sh
          bash scripts/install.sh --help >/dev/null
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/install.sh

