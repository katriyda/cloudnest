<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ status }} · CloudNest</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script src="/static/theme.js"></script>
<script src="/static/app.js" defer></script>
<script src="/static/alpine.min.js" defer></script>
</head>
<body class="auth-body" x-data="app">
<button class="icon-btn auth-theme theme-toggle" type="button" @click="toggleTheme()" aria-label="切换浅色/深色主题">
  <span x-show="theme === 'light'">{% include "icons/sun.svg" %}</span>
  <span x-show="theme === 'dark'" x-cloak>{% include "icons/moon.svg" %}</span>
</button>
<div class="auth-pane" style="min-height: 100vh; flex-direction: column; gap: var(--s-5);">
  <a class="auth-brand" href="/files"><span class="brand-mark">{% include "icons/cloud.svg" %}</span><span class="brand-name">CloudNest</span></a>
  <div class="auth-card error-card">
    <p class="error-code">{{ status }}</p>
    <h1 class="error-title">{{ title }}</h1>
    <p class="error-text">{{ message }}</p>
    <a class="btn btn-primary" href="/files">返回我的文件</a>
  </div>
</div>
</body>
</html>
