<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ status }} · CloudNest</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem('cn-theme');document.documentElement.setAttribute('data-theme',(t==='light'||t==='dark')?t:(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));}catch(e){}</script>
</head>
<body class="auth-body">
<div class="auth-shell">
  <section class="auth-facts">
    <div class="auth-brand">
      <a href="/" class="brand-link"><span class="brand-mark">{% include "icons/cloud.svg" %}</span><span class="brand-text">CloudNest</span></a>
    </div>
    <div class="auth-facts-body">
      <h1>操作没有完成</h1>
      <p class="auth-lede">可以回到文件列表再试一次；如果一直没有成功，请确认自己已经登录，或者联系管理员。</p>
    </div>
  </section>
  <section class="auth-pane">
    <div class="auth-card error-card">
      <h1>{{ title }}</h1>
      <p>{{ message }}</p>
      <a class="btn btn-primary" href="/files">返回我的文件</a>
    </div>
  </section>
</div>
</body>
</html>
