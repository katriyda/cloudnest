<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>需要提取密码 · CloudNest</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script src="/static/theme.js"></script>
<script src="/static/app.js" defer></script>
</head>
<body class="auth-body">
<div class="auth-shell">
  <section class="auth-facts">
    <div class="auth-brand">
      <div class="brand-link">
        <span class="brand-mark">{% include "icons/cloud.svg" %}</span>
        <span class="brand-text">CloudNest</span>
      </div>
      <button class="icon-btn theme-toggle" type="button" data-theme-toggle aria-label="切换主题">
        <span class="theme-icon-light">{% include "icons/sun.svg" %}</span>
        <span class="theme-icon-dark">{% include "icons/moon.svg" %}</span>
      </button>
    </div>
    <div class="auth-facts-body">
      <h1>需要提取密码</h1>
      <p class="auth-lede">{{ page.owner_name }} 分享了一个需要密码才能查看的内容。</p>
    </div>
  </section>

  <section class="auth-pane">
    <div class="auth-card">
      <div class="auth-head">
        <h2>输入提取密码</h2>
        <p>{{ page.root_name }}</p>
      </div>
      {% if let Some(error) = page.error %}
      <div class="flash flash-err" role="alert"><span class="flash-mark"></span><span>{{ error }}</span></div>
      {% endif %}
      <form method="post" action="/s/{{ page.token }}/unlock" class="stack-form">
        <label class="field">
          <span class="field-label">提取密码</span>
          <input type="password" name="password" required autofocus autocomplete="off">
        </label>
        <button class="btn btn-primary btn-block" type="submit">查看分享</button>
      </form>
    </div>
  </section>
</div>
</body>
</html>
