<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>初始化 · CloudNest</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script>
(function(){try{var t=localStorage.getItem('cn-theme');document.documentElement.setAttribute('data-theme',(t==='light'||t==='dark')?t:(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));}catch(e){}})();
</script>
<script src="/static/app.js" defer></script>
</head>
<body class="auth-body">
<div class="auth-shell">
  <div class="auth-brand">
    <a href="/" class="brand-link">
      <span class="brand-mark">{% include "icons/cloud.svg" %}</span>
      <span class="brand-text">Cloud<span>Nest</span></span>
    </a>
    <button class="icon-btn theme-toggle" type="button" data-theme-toggle aria-label="切换主题">
      <span class="theme-icon-light">{% include "icons/sun.svg" %}</span>
      <span class="theme-icon-dark">{% include "icons/moon.svg" %}</span>
    </button>
  </div>
  <div class="auth-card">
    <div class="auth-heading">
      <span class="eyebrow">首次启动</span>
      <h1>创建管理员账户</h1>
      <p>这是唯一一次初始化。管理员可以创建用户、分配存储空间。</p>
    </div>
    {% if let Some(error) = page.error %}
    <div class="flash flash-err" role="alert"><span class="flash-dot"></span><span>{{ error }}</span></div>
    {% endif %}
    <form method="post" action="/setup" class="stack-form">
      <label class="field">
        <span class="field-label">管理员用户名</span>
        <input type="text" name="username" required minlength="3" maxlength="32" autofocus autocomplete="username" spellcheck="false">
      </label>
      <label class="field">
        <span class="field-label">密码</span>
        <input type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password">
        <span class="field-hint">至少 8 个字符，建议使用长密码。</span>
      </label>
      <label class="field">
        <span class="field-label">确认密码</span>
        <input type="password" name="password_confirm" required minlength="8" maxlength="128" autocomplete="new-password">
      </label>
      <button class="btn btn-primary btn-block" type="submit">创建并进入</button>
    </form>
  </div>
  <p class="auth-copyright">CloudNest · 简单可靠的个人网盘</p>
</div>
</body>
</html>
