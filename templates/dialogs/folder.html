<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
  <div class="modal-head">
    <div><span class="eyebrow">当前目录</span><h2 id="dialog-title">新建文件夹</h2></div>
    <button type="button" class="icon-btn" data-modal-close aria-label="关闭">{% include "icons/close.svg" %}</button>
  </div>
  <p class="modal-note">{{ page.current_crumb }}</p>
  <form method="post" action="{{ page.action }}" class="stack-form">
    <input type="hidden" name="csrf" value="{{ page.csrf }}">
    <input type="hidden" name="parent_id" value="{{ page.parent_id }}">
    <label class="field">
      <span class="field-label">文件夹名称</span>
      <input type="text" name="name" required maxlength="200" autofocus autocomplete="off" placeholder="例如：照片">
    </label>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-modal-close>取消</button>
      <button class="btn btn-primary" type="submit">创建</button>
    </div>
  </form>
</div>
